<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mi Camino</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Concepto: app de bolsillo con cinta inferior; el micrófono es el botón central elevado. Estilo atlético: tipografía condensada, tarjetas planas, un solo azul de acento y un naranja solo para el asistente. */
:root{
  --sa-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sa-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--sa-left:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));--sa-right:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --bg:#EDF0F4; --card:#FFFFFF; --ink:#10151C; --ink2:#505C6B; --line:#DCE2E9; --track:#E4E9EF;
  --accent:#1D4ED8; --on-accent:#FFFFFF; --accent-soft:#E3EBFD;
  --hot:#E8481C; --good:#17996A; --warn:#B7791F;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --card:#161B22; --ink:#E8EDF3; --ink2:#9AA6B5; --line:#27303A; --track:#222A33;
    --accent:#7096FF; --on-accent:#0B1020; --accent-soft:#1B2740;
    --hot:#FF7B52; --good:#35C493; --warn:#E0A63A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --card:#161B22; --ink:#E8EDF3; --ink2:#9AA6B5; --line:#27303A; --track:#222A33;
  --accent:#7096FF; --on-accent:#0B1020; --accent-soft:#1B2740;
  --hot:#FF7B52; --good:#35C493; --warn:#E0A63A; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
button{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);
  padding-top:calc(8px + var(--sa-top));padding-bottom:132px;
  padding-left:max(16px,var(--sa-left));
  padding-right:max(16px,var(--sa-right))}
.shell{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#view{display:flex;flex-direction:column;gap:12px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
h2,h3{margin:0}
h2{font:800 28px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
h3{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
.muted{color:var(--ink2);font-size:14px}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
a{color:var(--accent)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 2px}
.brand{font:800 22px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.brand b{color:var(--accent)}
.sync{font-size:12px;color:var(--ink2);text-align:right}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dcenter{text-align:center;min-width:0}
.dcenter .d{font:800 36px/1 var(--display);text-transform:uppercase}
.dcenter .ds{font-size:14px;color:var(--ink2)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
.icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn[disabled]{opacity:.35;cursor:default}

.btn{min-height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font:700 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}

.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{display:block}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font:800 28px/1 var(--display)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.hero .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .big{font:700 26px/1.05 var(--display);text-transform:uppercase}
.streak{display:inline-flex;align-items:center;gap:6px;color:var(--hot);font-weight:700;font-size:14px}

.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 12px/1.7 var(--body);letter-spacing:.02em}
.mu{display:inline-flex;padding:1px 9px;border-radius:999px;background:var(--track);color:var(--ink2);font:600 12px/1.7 var(--body)}
.exs{display:flex;flex-direction:column}
.ex{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ex:first-child{border-top:0;padding-top:0}
.exn{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.exd{font-size:14px;color:var(--ink2)}
.mus{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

.chk{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;width:100%;min-height:58px;padding:8px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.chk:first-of-type{border-top:0}
.chk.auto{cursor:default}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"] .box,.chk.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk .l{display:block;font-weight:600}
.chk .s{display:block;font-size:13px;color:var(--ink2)}

.drops{display:flex;flex-wrap:wrap;gap:8px}
.drop{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--line);display:grid;place-items:center;cursor:pointer}
.drop.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label,.fields3 label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px}

.fields3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.zrow{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.zrow:first-of-type{border-top:0}
.zi{font:800 36px/1 var(--display)}
.zi .unit{font-size:15px}
.mk{display:grid;grid-template-columns:1.7fr 1fr .8fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.mk>*{min-width:0}
.mk .g{display:block;font-size:12px;color:var(--ink2)}
svg.chart.sp{width:96px;height:40px}
input[type=checkbox]{width:26px;min-height:26px;height:26px;flex:none;accent-color:var(--accent);padding:0}
input[type=time]{min-height:46px}
.remrow{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.remlbl{display:flex;gap:12px;align-items:flex-start;min-width:0}
.remlbl b{display:block}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.good i{background:var(--good)}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.val{font:800 34px/1 var(--display)}
.unit{font-size:14px;color:var(--ink2);font-weight:500}

.meal{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .k{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.meal .x{font-weight:500}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.dow{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.dow b{font:700 16px var(--display);text-transform:uppercase}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font:700 18px var(--display);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.tli:first-child{border-top:0}
.tli .tm{font:700 14px var(--body);color:var(--ink2);font-variant-numeric:tabular-nums}
.tli .kk{font:700 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase}
.tli .kk.m{color:var(--accent)} .tli .kk.w{color:var(--hot)} .tli .kk.n{color:var(--ink2)}
.tli .del{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lb{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tile .sb{font-size:13px;color:var(--ink2)}
.good{color:var(--good)} .warn{color:var(--warn)} .hotc{color:var(--hot)}
svg.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--ink2);font:500 11px var(--body)}
.chart .tgt{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.chart .tgt-t{fill:var(--good);font:700 11px var(--body)}
.chart .st{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 4}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--ink2);opacity:.55}
.chart .last{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .lv{fill:var(--ink);font:800 14px var(--display)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--accent)}
.legend .l2::before{background:var(--ink2);opacity:.6;height:6px;width:6px;border-radius:50%}
.legend .l3::before{background:var(--good)}
.wkh,.wk{display:grid;grid-template-columns:1.1fr .9fr .8fr 1.3fr .7fr;gap:8px;align-items:center}
.wkh{font:700 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.wk{padding:10px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.wk>*{min-width:0}
.pcttxt{font-size:12px;color:var(--ink2)}
.src{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(16px,var(--sa-right)) calc(8px + var(--sa-bottom)) max(16px,var(--sa-left))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:end}
.nb{background:none;border:0;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;padding:4px 0;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.nb[aria-current="page"]{color:var(--accent)}
.mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--hot);color:#fff;display:grid;place-items:center;margin:-34px auto 0;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);
  padding:16px max(16px,var(--sa-right)) calc(16px + var(--sa-bottom)) max(16px,var(--sa-left));display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:10px}
.ph h2{flex:1}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.ex-chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;text-align:left}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.mic-on{background:var(--hot);color:#fff;border:0}
.out{display:flex;flex-direction:column;gap:8px}
.out ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + var(--sa-bottom));z-index:50;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top" id="hd"></header>
  <main id="view"></main>
</div>
<nav class="nav" id="nav" aria-label="Secciones"></nav>

<div class="scrim" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="ph">
      <h2 id="sh-t">Asistente</h2>
      <span class="chip" id="sh-badge"></span>
      <button class="icon-btn" data-act="assist-close" aria-label="Cerrar" id="sh-x"></button>
    </div>
    <p class="muted" id="sh-for"></p>
    <textarea id="sh-text" rows="4" placeholder="Cuéntame cómo va el día. Ej.: hoy pesé 79,6, desayuné 2 huevos con arepa, salté cuerda 10 minutos."></textarea>
    <div class="examples" id="sh-ex"></div>
    <div class="acts">
      <button class="btn ghost" data-act="mic" id="sh-mic"></button>
      <button class="btn" data-act="anotar" id="sh-go">Anotar</button>
    </div>
    <p class="muted" id="sh-note" aria-live="polite"></p>
    <div class="out" id="sh-out" aria-live="polite"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const DOWL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const weekStart=s=>addDays(s,-((parse(s).getDay()+6)%7));
let TODAY=ymd(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d)=>Number(n).toFixed(d==null?1:d).replace('.',',');
const kg=v=>String(Math.round(v*10)/10).replace('.',',');
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:null;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const clone=o=>JSON.parse(JSON.stringify(o));
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const plugs={};
function plug(n){if(!NATIVE)return null;if(plugs[n]===undefined){try{plugs[n]=Capacitor.registerPlugin(n);}catch(e){plugs[n]=null;}}return plugs[n];}
const SRP=plug('SpeechRecognition'),LN=plug('LocalNotifications');

const IC={
 mic:'<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
 drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
 today:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18m-11 6 2 2 4-4"/>',
 food:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>',
 book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
 chart:'<path d="m22 17-8.5-8.5-5 5L2 7M16 17h6v-6"/>',
 left:'<path d="m15 18-6-6 6-6"/>',
 right:'<path d="m9 18 6-6-6-6"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 undo:'<path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'
};
const ic=(n,s)=>`<svg width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- Contenido ---------- */
const MET_ROPE=11.0; /* Compendio de Actividad Física, "Rope skipping exercise, general" */
const DEF={setup:false,name:'',startW:80,targetW:74,height:1.74,pMin:1.3,waterGoal:8,rem:{weigh:{on:true,t:'06:30'},lunch:{on:true,t:'12:30'},train:{on:true,t:'18:00'},diary:{on:true,t:'21:00'}}};
function normSettings(x){const s=Object.assign({},DEF,clone(x||{}));s.rem=Object.assign(clone(DEF.rem),(x&&x.rem)||{});Object.keys(DEF.rem).forEach(k=>{s.rem[k]=Object.assign({},DEF.rem[k],s.rem[k]);});s.customEx=Array.isArray(s.customEx)?s.customEx:[];s.name=String(s.name||'').slice(0,30);return s;}
/* dir: -1 si la meta es bajar, 1 si es subir, 0 si es mantener */
const gdir=()=>{const d=S.settings.targetW-S.settings.startW;return Math.abs(d)<0.05?0:d>0?1:-1;};
const PLAN={
 0:{title:'Descanso activo',kind:'Movilidad',min:10,ex:[
   {n:'Movilidad de cadera y hombros',d:'10 min, sin prisa',m:['Caderas','Hombros','Espalda baja']},
   {n:'Cocina por lotes',d:'Caraotas, arroz, pollo y huevos de la semana',m:['Descanso']}]},
 1:{title:'Cuerda por intervalos',kind:'Cardio',min:15,ex:[
   {n:'Caminata de calentamiento',d:'3–5 min',m:['Piernas']},

function normDay(x){

  d.checks=x.checks||{};d.meals=Array.isArray(x.meals)?x.meals:[];d.work=Array.isArray(x.work)?x.work:[];
  d.notes=Array.isArray(x.notes)?x.notes:[];d.lifts=Array.isArray(x.lifts)?x.lifts:[];d.water=+x.water||0;return d;
}

function isDone(date,id){
  const d=S.days[date];if(!d)return false;

}
function pct(date){const it=items(date);return Math.round(100*it.filter(i=>isDone(date,i.id)).length/it.length);}

const KEY='camino74.v1',AIKEY='camino74.apikey';
async function kvGet(k){const P=plug('Preferences');try{if(P){const r=await P.get({key:k});return(r&&r.value!=null)?r.value:null;}}catch(e){}try{return localStorage.getItem(k);}catch(e){return null;}}
async function kvSet(k,v){const P=plug('Preferences');try{if(P){await P.set({key:k,value:v});return;}}catch(e){}try{localStorage.setItem(k,v);}catch(e){}}
async function loadStore(){
  let raw=await kvGet(KEY);
  if(raw==null){try{raw=localStorage.getItem(KEY);}catch(e){}}
  try{const r=JSON.parse(raw||'null');if(r){S.settings=normSettings(r.settings);if(!r.settings||r.settings.setup==null)S.settings.setup=true;Object.keys(r.days||{}).forEach(k=>{S.days[k]=normDay(Object.assign({date:k},r.days[k]));});}}catch(e){}
}
function saveLocal(){kvSet(KEY,JSON.stringify({settings:S.settings,days:S.days}));}
function payload(id){return id==='settings'?S.settings:(S.days[id.slice(2)]||null);}
function schedule(id){clearTimeout(timers[id]);setSync('saving');timers[id]=setTimeout(()=>{delete timers[id];flush(id);},500);}
function flush(id){
  if(S.mode!=='cloud'){saveLocal();setSync('local');return;}
  const data=payload(id),ref=col.doc(id);
  chains[id]=(chains[id]||Promise.resolve())
    .then(()=>data===null?ref.delete():ref.set(clone(data)))
    .then(()=>{if(!Object.keys(timers).length)setSync('ok');})
    .catch(e=>{setSync('err');toast('No se pudo guardar'+(e&&e.code?' ('+e.code+')':'')+'. Inténtalo otra vez.');});
}
function commit(date){render();schedule('d-'+date);}
function commitSettings(){render();schedule('settings');}

function trend(){
  const ws=weights();if(ws.length<4)return null;
  const last=ws[ws.length-1].date,rec=ws.filter(p=>diffDays(p.date,last)<=13);
  if(rec.length<4||diffDays(rec[0].date,last)<6)return null;

function groupSeries(stats){
  const out={};

    const exs=stats.filter(h=>h.ex.g===g);if(!exs.length)return;
    const first=exs.map(h=>h.pts[0].date).sort()[0],pts=[];
    for(let wk=weekStart(first);wk<=weekStart(TODAY);wk=addDays(wk,7)){
      const end=addDays(wk,6),ratios=[];

      });
      if(ratios.length)pts.push({date:wk,v:100*ratios.reduce((a,b)=>a+b,0)/ratios.length});

  });

}

function webMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,note=$('#sh-note'),ta=$('#sh-text');
  if(!SR){note.textContent='Este navegador no ofrece dictado dentro de la página. Toca el campo y usa el micrófono de tu teclado.';ta.focus();return;}
  if(listening){try{rec.stop();}catch(e){}return;}
  try{rec=new SR();}catch(e){note.textContent='No pude iniciar el micrófono. Escribe o usa el dictado del teclado.';return;}
  rec.lang='es-VE';rec.interimResults=true;rec.continuous=false;
  const base=ta.value?ta.value.trim()+' ':'';
  rec.onresult=ev=>{let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;ta.value=base+t;};
  rec.onerror=ev=>{listening=false;setMic();
    note.textContent=(ev.error==='not-allowed'||ev.error==='service-not-allowed')?'El navegador no deja usar el micrófono aquí. En la app de Android «Mi Camino» sí funciona. Mientras tanto, escribe o usa el micrófono de tu teclado.':(ev.error==='no-speech'?'No te escuché. Inténtalo de nuevo.':'No pude usar el micrófono ('+ev.error+').');};
  rec.onend=()=>{listening=false;setMic();if($('#sh-note').textContent==='Escuchando…')$('#sh-note').textContent='';};
  try{rec.start();listening=true;setMic();note.textContent='Escuchando…';}catch(e){listening=false;setMic();note.textContent='No pude iniciar el micrófono. Escribe o usa el dictado del teclado.';}
}
async function nativeMic(){
  const ta=$('#sh-text'),note=$('#sh-note');
  try{
    if(listening){await SRP.stop();listening=false;setMic();return;}
    const av=await SRP.available();
    if(!av||!av.available){note.textContent='Este teléfono no tiene el reconocimiento de voz de Google activo. Escribe o usa el micrófono del teclado.';ta.focus();return;}
    let p=await SRP.checkPermissions();
    if(p.speechRecognition!=='granted')p=await SRP.requestPermissions();
    if(p.speechRecognition!=='granted'){note.textContent='Necesito el permiso de micrófono. Actívalo en Ajustes del teléfono, Aplicaciones, Mi Camino.';return;}
    await SRP.removeAllListeners();
    const base=ta.value?ta.value.trim()+' ':'';
    await SRP.addListener('partialResults',d=>{if(d&&d.matches&&d.matches.length)ta.value=base+d.matches[0];});
    await SRP.addListener('listeningState',d=>{if(d&&d.status==='stopped'){listening=false;setMic();if($('#sh-note').textContent==='Escuchando…')$('#sh-note').textContent='';}});
    listening=true;setMic();note.textContent='Escuchando…';
    await SRP.start({language:'es-VE',maxResults:1,partialResults:true,popup:false});
  }catch(e){listening=false;setMic();note.textContent='No pude usar el micrófono ('+((e&&e.message)||'error')+'). Escribe o usa el micrófono del teclado.';}
}

function cleanRes(r){
  const o={},n=(v,a,b)=>{v=num(v);return(v!=null&&v>=a&&v<=b)?v:null;};
  if(!r||typeof r!=='object')return o;
  const w=n(r.weight_kg,30,300);if(w!=null)o.weight=Math.round(w*10)/10;
  const c=n(r.waist_cm,40,250);if(c!=null)o.waist=Math.round(c*10)/10;
  const wa=n(r.water_glasses_add,1,20);if(wa!=null)o.water=Math.round(wa);
  o.meals=(Array.isArray(r.meals)?r.meals:[]).slice(0,8).map(m=>({kind:['desayuno','almuerzo','cena','merienda'].indexOf(m&&m.kind)>=0?m.kind:'otro',text:String((m&&m.text)||'').slice(0,160),prot:n(m&&m.protein_g,0,200),kcal:n(m&&m.kcal,0,2500)})).filter(m=>m.text);
  o.work=(Array.isArray(r.workouts)?r.workouts:[]).slice(0,6).map(x=>({type:['cuerda','caminata','fuerza','escaleras'].indexOf(x&&x.type)>=0?x.type:'otro',min:n(x&&x.min,1,400)})).filter(x=>x.min!=null);
  o.lifts=(Array.isArray(r.lifts)?r.lifts:[]).slice(0,10).map(x=>{const ex=exById(x&&x.ex_id);if(!ex)return null;const k=n(x.kg,0,500),re=n(x.reps,1,ex.m==='time'?900:100),se=n(x.sets,1,20);if(re==null)return null;if(ex.m==='load'&&!(k>0))return null;return{ex:ex.id,kg:ex.m==='load'?k:0,reps:Math.round(re),sets:Math.round(se||1)};}).filter(Boolean);
  o.checks=(Array.isArray(r.checks_done)?r.checks_done:[]).filter(id=>['train','stairs','prot','nosnack','diary','batch'].indexOf(id)>=0);
  const mo=n(r.mood,1,5);if(mo!=null)o.mood=Math.round(mo);const en=n(r.energy,1,5);if(en!=null)o.energy=Math.round(en);
  if(typeof r.note==='string'&&r.note.trim())o.note=r.note.trim().slice(0,400);
  return o;
}
function parseLocal(text){
  const t=text.toLowerCase(),o={meals:[],work:[],checks:[],lifts:[]};let m;
  m=t.match(/(?:pes[eé]|peso(?!\s+muerto)|pesaba|marc[oó]|báscula|bascula)\D{0,14}(\d{2,3}(?:[.,]\d{1,2})?)/);if(m){const v=num(m[1]);if(v>=30&&v<=300)o.weight=v;}
  m=t.match(/cintura\D{0,14}(\d{2,3}(?:[.,]\d)?)/);if(m){const v=num(m[1]);if(v>=40&&v<=250)o.waist=v;}
  m=t.match(/(\d+)\s*vasos?/);if(m){const v=+m[1];if(v>=1&&v<=20)o.water=v;}
  m=t.match(/(?:salt[eé]|cuerda)\D{0,25}(\d{1,3})\s*(?:min|minutos)/)||t.match(/(\d{1,3})\s*(?:min|minutos)\D{0,15}cuerda/);if(m)o.work.push({type:'cuerda',min:+m[1]});
  m=t.match(/camin[eé]\D{0,20}(\d{1,3})\s*(?:min|minutos)/);if(m)o.work.push({type:'caminata',min:+m[1]});
  if(/escalera/.test(t))o.checks.push('stairs');
  const NW={un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5};
  text.split(/\.(?!\d)|;|\n|,(?!\d)/).forEach(part=>{
    const q=part.trim();const mm=q.match(/\b(desayun|almorc|cen|merend)[eé]\s+(.+)/i)||q.match(/\bcom[ií]\s+(.+)/i);
    if(!mm)return;
    const kind=mm.length>2?({desayun:'desayuno',almorc:'almuerzo',cen:'cena',merend:'merienda'})[mm[1].toLowerCase()]:'otro';
    const txt=(mm.length>2?mm[2]:mm[1]).trim();
    let prot=null;const eg=txt.toLowerCase().match(/\b(\d+|un|una|dos|tres|cuatro|cinco)\s+huevos?\b/);
    if(eg){const c=/^\d+$/.test(eg[1])?+eg[1]:NW[eg[1]];if(c>0&&c<=12)prot=6*c;}
    o.meals.push({kind:kind,text:txt,prot:prot});
  });
  const norm=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'');
  const LK=[['peso muerto','rdl'],['press de pecho','press_pecho'],['press de hombro','press_hombro'],['elevaciones laterales','elev_lat'],['plancha lateral','plancha_lat'],['plancha','plancha'],['sentadilla','sent'],['zancada','zanc'],['flexion','flex'],['puente','puente'],['remo','remo_moch'],['dominada','dominadas'],['curl','curl'],['fondos','fondos'],['triceps','ext_tri'],['abdominal','abdom']];
  text.split(/\.(?!\d)|;|\n|,(?!\d)/).forEach(part=>{
    const q=norm(part.toLowerCase()),hit=LK.find(a=>q.indexOf(a[0])>=0);if(!hit)return;
    const sx=q.match(/(\d+)\s*x\s*(\d+)/),se=q.match(/(\d+)\s*series?/);
    const re=q.match(/(?:\bde\b|\bpor\b)\s*(\d+)/)||q.match(/(\d+)\s*(?:repeticiones|reps)/);
    const kgm=q.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|kilos?|kilogramos?)/),sg=q.match(/(\d+)\s*(?:segundos|seg)\b/);
    const k=kgm?num(kgm[1]):0;let id=hit[1];
    if(id==='sent')id=k>0?'sent_kg':'sent_pc';else if(id==='zanc')id=k>0?'zanc_kg':'zanc_pc';
    const ex=exById(id);if(!ex)return;
    const reps=ex.m==='time'?(sg?+sg[1]:null):(sx?+sx[2]:(re?+re[1]:null));
    if(!reps)return;
    o.lifts.push({ex:id,kg:k||0,reps:reps,sets:sx?+sx[1]:(se?+se[1]:1)});
  });
  return o;
}
const isEmpty=o=>!o||(!o.weight&&!o.waist&&!o.water&&!(o.meals&&o.meals.length)&&!(o.work&&o.work.length)&&!(o.lifts&&o.lifts.length)&&!(o.checks&&o.checks.length)&&!o.mood&&!o.energy&&!o.note);
function applyResult(o,date){
  const d=ensure(date),t=hhmm(),L=[];
  if(o.weight){d.weight=o.weight;L.push('Peso: '+kg(o.weight)+' kg');}
  if(o.waist){d.waist=o.waist;L.push('Cintura: '+kg(o.waist)+' cm');}
  if(o.water){d.water=Math.min(30,d.water+o.water);L.push('Agua: +'+o.water+' vasos (llevas '+d.water+')');}
  (o.meals||[]).forEach(m=>{d.meals.push({id:uid(),t:t,kind:m.kind,text:m.text,prot:m.prot!=null?Math.round(m.prot):null,kcal:m.kcal!=null?Math.round(m.kcal):null});L.push(m.kind.charAt(0).toUpperCase()+m.kind.slice(1)+': '+m.text+(m.prot!=null?' (≈ '+Math.round(m.prot)+' g de proteína)':''));});
  (o.work||[]).forEach(x=>{d.work.push({id:uid(),t:t,type:x.type,min:Math.round(x.min)});d.checks.train=true;L.push('Entreno: '+x.type+' '+Math.round(x.min)+' min');});
  (o.lifts||[]).forEach(x=>{const e=exById(x.ex);if(!e)return;d.lifts.push({id:uid(),t:t,ex:x.ex,kg:x.kg,reps:x.reps,sets:x.sets});d.checks.train=true;L.push('Fuerza: '+e.n+', '+liftText(e,x));});
  (o.checks||[]).forEach(id=>{d.checks[id]=true;L.push('Marcado: '+({train:'entreno',stairs:'escaleras',prot:'proteína',nosnack:'sin picar',diary:'cierre del día',batch:'cocina del domingo'})[id]);});
  if(o.mood){d.mood=o.mood;L.push('Ánimo: '+o.mood+' de 5');}
  if(o.energy){d.energy=o.energy;L.push('Energía: '+o.energy+' de 5');}
  if(o.note){d.notes.push({id:uid(),t:t,text:o.note});L.push('Nota guardada');}
  return L;
}
async function askClaude(prompt,raw){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','x-api-key':S.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:raw?30:800,messages:[{role:'user',content:prompt}]})});
    if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;try{const j=await r.json();e.detail=(j&&j.error&&j.error.message)||'';}catch(x){}throw e;}
    const j=await r.json(),txt=(j.content||[]).map(b=>b.text||'').join('');
    if(raw)return txt;
    const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    if(a<0||b<a)throw new Error('sin JSON');
    return JSON.parse(txt.slice(a,b+1));
  }finally{clearTimeout(to);}
}
function aiErr(e){
  const st=e&&e.status,d=e&&e.detail?' Detalle: '+String(e.detail).slice(0,160):'';
  if(st===401)return 'La clave no es válida o fue revocada. Créala de nuevo y pégala otra vez.'+d;
  if(st===403)return 'La cuenta no tiene permiso para usar la API (puede ser por región o por la clave).'+d;
  if(st===400)return 'La API rechazó la solicitud; si el detalle habla de saldo, recarga crédito en Billing.'+d;
  if(st===402)return 'Hace falta saldo en la cuenta de la API.'+d;
  if(st===404)return 'El modelo no está disponible para esta cuenta.'+d;
  if(st===429)return 'Demasiadas solicitudes seguidas. Espera un momento.'+d;
  if(st>=500)return 'El servicio de Anthropic está ocupado ahora ('+st+'). Inténtalo en un rato.'+d;
  if(e&&e.name==='AbortError')return 'La conexión tardó demasiado. Revisa tu internet.';
  return 'No hubo conexión con la API. Revisa tu internet.';
}
async function aiTest(){
  if(!S.aiKey){toast('Primero pega tu clave.');return;}
  const b=$('#ai-test');if(b){b.disabled=true;b.textContent='Probando…';}
  try{const t=await askClaude('Responde solo la palabra: listo',true);toast('La IA funciona. Respuesta: '+String(t).trim().slice(0,30));}
  catch(e){toast(aiErr(e));}
  finally{const b2=$('#ai-test');if(b2){b2.disabled=false;b2.textContent='Probar clave';}}
}
async function anotar(){
  const ta=$('#sh-text'),text=ta.value.trim(),out=$('#sh-out'),btn=$('#sh-go'),note=$('#sh-note');
  if(!text){note.textContent='Cuéntame algo primero, o toca un ejemplo.';return;}
  if(listening&&rec)try{rec.stop();}catch(e){}
  btn.disabled=true;note.textContent='';out.innerHTML='<p class="muted">Anotando…</p>';
  const date=S.date;let res=null,used='local';
  if(S.aiKey){
    const ids=items(date).map(i=>i.id).filter(i=>i!=='weigh'&&i!=='water').join(', '),exList=allEx().map(e=>e.id+'='+e.n+' ('+e.m+')').join('; ');
    const prompt='Eres el asistente de un diario de entrenamiento y dieta de una persona en Venezuela. Extrae SOLO lo que la persona dijo, sin inventar nada. Fecha: '+date+'.\nTexto: """'+text+'"""\nResponde únicamente un objeto JSON con estas claves (omite las que no apliquen): {"weight_kg":number,"waist_cm":number,"water_glasses_add":number,"meals":[{"kind":"desayuno|almuerzo|cena|merienda|otro","text":string,"protein_g":number,"kcal":number}],"workouts":[{"type":"cuerda|caminata|fuerza|escaleras|otro","min":number}],"checks_done":[ids entre: '+ids+'],"mood":1-5,"energy":1-5,"note":string,"lifts":[{"ex_id":string,"kg":number,"reps":number,"sets":number}]}. Para ejercicios de fuerza usa ex_id de esta lista (id=nombre y modo): '+exList+'. kg es 0 si es con peso corporal; en planchas reps son los segundos. Para cada comida estima protein_g y kcal de forma aproximada con porciones típicas venezolanas; si no puedes estimar, omítelos. Incluye mood y energy solo si la persona dijo cómo se sintió. Usa punto decimal.';
    try{res=cleanRes(await askClaude(prompt));used='ia';}catch(e){res=null;note.textContent=aiErr(e)+' Anoté con el modo básico.';}
  }
  if(!res){const p=parseLocal(text);res=cleanRes({weight_kg:p.weight,waist_cm:p.waist,water_glasses_add:p.water,workouts:p.work,checks_done:p.checks,meals:p.meals.map(m=>({kind:m.kind,text:m.text,protein_g:m.prot})),lifts:p.lifts.map(l=>({ex_id:l.ex,kg:l.kg,reps:l.reps,sets:l.sets}))});}
  if(isEmpty(res))res.note=text;
  const prev=S.days[date]?clone(S.days[date]):null;
  const lines=applyResult(res,date);lastUndo={date:date,prev:prev};commit(date);
  ta.value='';btn.disabled=false;
  out.innerHTML=`<div><b>Listo, anoté esto:</b></div><ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>${used==='ia'?'<p class="muted">Las calorías y la proteína de las comidas son estimaciones de la IA. Corrígelas en el Diario si no cuadran.</p>':''}<div><button class="btn ghost small" data-act="undo">${ic('undo',18)} Deshacer</button></div>`;
}
function undo(){
  if(!lastUndo)return;const l=lastUndo;lastUndo=null;
  if(l.prev)S.days[l.date]=l.prev;else delete S.days[l.date];
  commit(l.date);$('#sh-out').innerHTML='<p class="muted">Deshecho.</p>';
}

/* ---------- Arranque ---------- */
function subscribe(){
  col.onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id;if(timers[id])return;
      if(ch.type==='removed'){if(id.indexOf('d-')===0)delete S.days[id.slice(2)];return;}
      const data=ch.doc.data()||{};
      if(id==='settings')S.settings=Object.assign({},DEF,clone(data));
      else if(id.indexOf('d-')===0)S.days[id.slice(2)]=normDay(Object.assign({},data,{date:id.slice(2)}));
    });
    setSync(Object.keys(timers).length?'saving':'ok');render();
  },()=>{S.mode='local';loadLocal();setSync('local');toast('Sin conexión con tu cuenta. Guardo solo en este navegador.');render();});
}
$('#sh-x').innerHTML=ic('x',20);
$('#sh-ex').innerHTML=EXAMPLES.map(x=>`<button class="ex-chip" data-act="example" data-text="${esc(x)}">${esc(x)}</button>`).join('');
render();

  if(document.hidden)return;
  const n=ymd(new Date());
